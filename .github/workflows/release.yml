name: 打包并发布 exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot 4.7 和导出模板
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          ls -la templates | head -5
          cat templates/version.txt
          mv templates 4.7.stable
          mkdir -p ~/.local/share/godot/export_templates
          mv 4.7.stable ~/.local/share/godot/export_templates/
          echo "== 装好的模板 =="
          ls -la ~/.local/share/godot/export_templates/4.7.stable/ | head -12

      - name: 导入游戏资源
        run: ./Godot_v4.7-stable_linux.x86_64 --headless --path game --import

      - name: 导出单文件 exe
        run: |
          mkdir -p build
          set +e
          ./Godot_v4.7-stable_linux.x86_64 --headless --path game --export-release "Windows Desktop" ../build/game.exe > export.log 2>&1
          code=$?
          echo "===== 导出退出码 $code ====="
          tail -60 export.log
          if [ $code -ne 0 ]; then
            {
              echo "## 导出退出码: $code"
              echo '```'
              tail -120 export.log
              echo '```'
              echo "HOME=$HOME"
              echo "XDG_DATA_HOME=$XDG_DATA_HOME"
              ls -la ~/.local/share/godot/ 2>&1 || true
              ls -la ~/.local/share/godot/export_templates/ 2>&1 || true
              ls -la ~/.local/share/godot/export_templates/*/ 2>&1 | head -20 || true
            } >> $GITHUB_STEP_SUMMARY
            exit $code
          fi
          # 中文文件名会被 GitHub 改成 default.exe，所以资产用拼音名
          mv build/game.exe build/tongfuqiyuan.exe
          ls -lh build/

      - name: 清掉这个 release 里多余的旧资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}"
          for a in $(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            if [ "$a" != "tongfuqiyuan.exe" ]; then
              echo "删掉旧资产 $a"
              gh release delete-asset "$tag" "$a" -y || true
            fi
          done

      - name: 发到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}
          name: 同福奇缘 · Godot 移植版 ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0' }}
          body: |
            ### 直接下下面那个 tongfuqiyuan.exe，双击就能玩

            不用装 Godot，不用解压，单文件 300MB。
            它就是《同福奇缘》，文件名用拼音是因为 GitHub 会把中文名改成 default.exe。

            - 画面 / 剧情 / 数值全部来自原版 Flash，逐帧一致
            - 额外加了：存档 / 读档（F5 / F9）、隐藏道具图鉴（右上角开关或 Tab，没拿到的显示 ？？？）
            - 操作：剧情继续 = 空格；战斗先机 / 后发 = A / D；技能 = Z X C V B N；逃跑 = Q
            - 战斗伤害飘字（掉血 / 回血都会飘数字）、战斗奖励翻倍（生命 +6 / 修为 +10 / 技力 +20 / 威望 +2 / 铜钱 +100）

            源码（含原版 SWF）在仓库里。
          files: build/tongfuqiyuan.exe
          fail_on_unmatched_files: true
